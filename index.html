<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="animatedclock.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<title>Animated Clock</title>
<body>
<div class="card">
    <form action="">
        <label for=""> Face Color</label>
            <input type="color" class="form-input" name="" id="face-color" value="#f4f4f4" ><br>
       
        <label for=""> Border Color</label>
            <input type="color" name=""class="form-input" id="border-color" value="#800000" ><br>
        
        <label for=""> Number Lines color</label>
            <input type="color" class="form-input" name="" id="number-color" value="#000000" ><br>
        
        <label for=""> Large Hand color</label>
            <input type="color" class="form-input" name="" id="large-color" value="#800000" ><br>
        
        <label for=""> Second Hand color</label>
            <input type="color" class="form-input" name="" id="small-color" value="#ff7f50" >
        <button>Save As Change</button>
    </form>
</div>
 <canvas id="canvas" width="700" height="700"></canvas>

</html>
